


# Redox OS 0.9.0 (x86_64) -- the ONLY released Redox version (2024-09-07).
#
# Redox ships no remote-access server of any kind, so this builder bakes one
# in, the way reactos-builder does: hooks/host_prepareImage.py offline-injects
# files/anyvmd.bin (built by tools/build-anyvmd.sh) and an init.d entry, and
# anyvm drives it over telnet.
#
# The agent is #![no_std] and links `redox-rt`, NOT relibc. That is what makes
# it possible at all: the 0.9.0 kernel has no process-creation syscall (its
# dispatch table at the release-day commit 9673fa26b6c0 has no CLONE, FEXEC,
# SPAWN or FORK), spawning lives in userspace in redox-rt, and redox-rt is
# itself no_std and libc-independent -- so the agent gets real process
# creation while never linking the relibc CRT that UD2s on this frozen image.
#
# Verified end to end against a stock image: readiness marker, a shell command
# with && and ;, a real tar push answered with anyvm-tar-done, and the file
# readable afterwards over a fresh connection.

# Prebuilt "server" variant = text console, no Orbital GUI. .img.zst is handled
# by build.py:_prep_vhd_disk (download -> zstd -d -> keep raw .img -> qcow2),
# and the raw .img is what host_prepareImage.py mounts with redoxfs.
VM_VHD_LINK="https://static.redox-os.org/releases/0.9.0/x86_64/redox_server_x86_64_2024-09-07_1225_harddrive.img.zst"

VM_OS_NAME="redox"
VM_RELEASE=0.9.0
VM_SSH_PORT=2222

# Boot devices proven on a stock image: Redox 0.9.0 boots from an IDE disk
# (ahcid is present too, but ide is what the stock "make qemu" raw-drive layout
# gives and what we verified) and talks to the e1000 NIC (e1000d driver).
# build.py forwards 127.0.0.1:VM_SSH_PORT -> guest:23, where anyvmd listens.
VM_DISK=ide
VM_NIC=e1000

# The agent speaks telnet, not ssh: Redox has no sshd and cannot get one on
# 0.9.0. Same shape as plan9 and reactos -- build.py points the control hostfwd
# at guest port 23, swaps _wait_ssh for _wait_telnet, sends the shutdown over
# telnet, and skips every ssh-only stage.
#
# The server behind that port is our own /usr/bin/anyvmd, which hands each
# connection to ion on a pty. It authenticates nobody and is reachable only
# through the slirp hostfwd bound to 127.0.0.1 -- the same threat model as
# plan9-builder's no-auth telnetd and reactos-builder's anyvmtd.exe.
#
# No VM_TELNET_PROBE_CMD override is needed: _telnet_ready_check's default
# probe is Plan 9 rc syntax (`echo anyvm''-ready`), and ion collapses '' the
# same way rc and sh do, so the marker appears in the output but not in the
# guest's echo of the command line. (ReactOS needs an override because cmd.exe
# does not treat '' as a quote split at all.)
VM_TRANSPORT=telnet

# Redox server runs comfortably in 2 GiB; 2 vCPUs.
VM_MEMORY=2048
VM_CPU=2

# shutdown_and_wait() sends this over telnet. Leaving it unset is not a no-op:
# build.py sends the empty string, nothing happens in the guest, and the build
# sits in the shutdown poll for the full 600 s before force-killing.
#
# Read off the image, not guessed: `ls /bin` on a running 0.9.0 guest lists
# `shutdown`, and sending it powered QEMU off within 10 s. That is worth
# stating because the sibling telnet guest does NOT behave this way -- plan9's
# fshalt halts the CPU and leaves QEMU running, which is why build.py's
# _wait_vm_down carries halt-banner detection and a force-kill. Redox needs
# neither; it exits cleanly on its own.
#
# Expect `telnet shutdown command sent (connected=False)` in the log. That
# False is the SUCCESS case, not a fault: the guest tears the machine down
# while the socket is still open, so telnet_exec sees the peer vanish. A True
# there would mean the command did nothing.
VM_SHUTDOWN_CMD="shutdown"

# Server image has no GUI; std VGA is harmless and we drive everything over the
# serial/TCP path, not VNC OCR.
VM_VGA=std
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# Not what the build waits on: hooks/host_waitForLoginTag.py overrides the
# serial-text wait with a marker probe of the agent's port, because a login
# prompt only proves a getty is up, not that the agent the pipeline talks to
# is. The tag itself is accurate though -- Redox does print it, on the
# framebuffer console AND on the serial port -- so it stays as documentation
# and as the fallback if that hook is ever removed.
VM_LOGIN_TAG="redox login:"

# tar is the only backend, and it is enough: /bin/tar is already on the stock
# image, so unlike ReactOS nothing has to be baked in for it. rsync/sshfs/scp
# and nfs all need an sshd or a server Redox does not have.
#
# One quirk the agent handles: Redox's tar is the old BSD form and rejects the
# GNU spelling -- `tar -xf -` gives "unknown operation ... need to specify
# c[f] (create), t[f] (list), or x[f] (extract)". The f is optional, so the
# agent runs `tar x` (stdin) and `tar c .`.
VM_SYNC_METHODS="tar"
